<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>キャストからのメッセージ（確認用）</title>
</head>
<body>
<!-- 確認用ページ。STUDIO に貼るのは studio_dm_snippet.html と同じ3行（下の style・div・script）。
     ここではこのサイトの dm-notice.js を相対パスで読む（ローカル確認でもローカルの中身が出る）。
     背景が透明なので白地では文字が見えにくい（STUDIO 上で暗い背景に乗る前提）。?start=cast_id でその人から始まる -->
<style>#bs-dm-notice{min-height:124px}@media(min-width:601px){#bs-dm-notice{min-height:140px}}@media(min-width:601px) and (max-width:721px){#bs-dm-notice{min-height:146px}}</style>
<div id="bs-dm-notice"></div>
<script>(function(){var s=new URLSearchParams(location.search).get('start');if(s&&/^[1-9][0-9]*$/.test(s))document.getElementById('bs-dm-notice').dataset.start=s;})();</script>
<script src="dm-notice.js"></script>
</body>
</html>
